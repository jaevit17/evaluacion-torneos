<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Torneos Gamer</title>
</head>
<body>

    <h1>Dashboard de Torneos Gamer</h1>

    <form>
        <div>
            <h3>Nombre del torneo:</h3>
            <input id="nombreT" type="text" placeholder="Ingrese nombre">

            <h3>Categoría:</h3>
            <p>Lucha, Estrategia, Arcade, Deportes</p>
            <input id="categoriaT" type="text" placeholder="Ingrese categoría">

            <h3>Participantes:</h3>
            <input id="participantesT" type="number" placeholder="Ingrese participantes">

            <h3>Valor de inscripción:</h3>
            <input id="valorT" type="number" placeholder="Ingrese valor">

            <h3>Email del organizador:</h3>
            <input id="emailT" type="email" placeholder="Ingrese email">
        </div>

        <br>

        <button type="button" onclick="registrarTorneo()">
            REGISTRAR TORNEO
        </button>

        <div id="tablaRegistro">
            <table>
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Participantes</th>
                    <th>Valor de inscripción</th>
                    <th>Email</th>
                    <th>Recaudación</th>
                </tr>
            </table>
        </div>

        <p id="smsError"></p>
    </form>

    <script src="utilitarios.js"></script>
    <script src="hoy.js"></script>

</body>
</html>
